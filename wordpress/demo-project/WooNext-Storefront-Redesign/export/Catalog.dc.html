<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div class="pb-16">
<section class="relative isolate overflow-hidden bg-petrol">
  <div class="absolute inset-0 grid grid-cols-2"><img src="{{ heroA }}" alt="" class="h-full w-full object-cover"><img src="{{ heroB }}" alt="" class="h-full w-full object-cover"></div>
  <div class="absolute inset-0 bg-gradient-to-r from-midnight via-midnight/80 to-petrol/30"></div>
  <div class="relative mx-auto flex max-w-7xl flex-col gap-4 px-4 py-12 sm:px-6 sm:py-16 lg:px-8 lg:py-20">
    <nav aria-label="Breadcrumb"><ol class="flex flex-wrap items-center gap-2 text-xs font-semibold uppercase tracking-widest text-peach/70"><sc-for list="{{ crumbs }}" as="c"><li class="flex items-center gap-2"><sc-if value="{{ c.href }}"><a href="{{ c.href }}" class="hover:text-flame">{{ c.label }}</a><span aria-hidden="true">/</span></sc-if><sc-if value="{{ c.last }}"><span aria-current="page" class="text-cream">{{ c.label }}</span></sc-if></li></sc-for></ol></nav>
    <p class="font-script text-4xl text-peach">{{ kicker }}</p>
    <h1 class="max-w-3xl font-display text-6xl uppercase leading-none text-cream sm:text-7xl lg:text-8xl">{{ title }}</h1>
    <p class="max-w-xl text-base leading-relaxed text-peach/85">{{ blurb }}</p>
    <sc-if value="{{ isSearch }}">
      <form onSubmit="{{ submitQ }}" role="search" class="mt-2 flex w-full max-w-xl overflow-hidden rounded-md bg-cream ring-2 ring-transparent focus-within:ring-ember">
        <label for="sr-q" class="sr-only">Search products</label>
        <input id="sr-q" type="search" value="{{ localQ }}" onChange="{{ onLocalQ }}" placeholder="Search WooNext" class="min-h-12 flex-1 border-0 bg-transparent px-4 font-semibold text-midnight placeholder-midnight/50 focus:outline-none focus:ring-0">
        <button type="submit" class="inline-flex items-center gap-2 bg-rust px-5 text-sm font-bold uppercase tracking-widest text-cream transition hover:bg-midnight"><dc-import name="Icon" i="search" cls="h-4 w-4" hint-size="16px,16px"></dc-import>Search</button>
      </form>
    </sc-if>
  </div>
</section>

<sc-if value="{{ hasSubs }}">
  <nav aria-label="Subcategories" class="border-b border-white/10 bg-navy">
    <ul class="mx-auto flex max-w-7xl gap-2 overflow-x-auto px-4 py-3 sm:px-6 lg:px-8">
      <sc-for list="{{ subNav }}" as="s"><li class="shrink-0"><a href="{{ s.href }}" aria-current="{{ s.cur }}" class="inline-flex min-h-11 items-center rounded-full px-5 text-sm font-bold uppercase tracking-widest transition duration-200 {{ s.cls }}">{{ s.label }} <span class="ml-1.5 text-xs opacity-70">{{ s.n }}</span></a></li></sc-for>
    </ul>
  </nav>
</sc-if>

<div class="mx-auto flex max-w-7xl gap-8 px-4 pt-8 sm:px-6 lg:px-8">
  <div class="fixed inset-0 z-50 bg-midnight/80 backdrop-blur-sm transition-opacity duration-300 lg:hidden {{ backdrop }}" onClick="{{ closeF }}" aria-hidden="true"></div>
  <aside ref="{{ fRef }}" aria-label="Product filters" role="{{ fRole }}" aria-modal="{{ fModal }}" class="fixed inset-y-0 left-0 z-50 flex w-full max-w-xs flex-col overflow-y-auto bg-petrol transition-transform duration-300 ease-out motion-reduce:transition-none lg:visible lg:static lg:z-auto lg:w-64 lg:max-w-none lg:shrink-0 lg:translate-x-0 lg:overflow-visible lg:bg-transparent {{ drawer }}">
    <div class="flex items-center justify-between border-b border-white/10 p-4 lg:hidden"><h2 class="font-display text-3xl uppercase text-cream">Filters</h2><button type="button" onClick="{{ closeF }}" aria-label="Close filters" class="grid h-11 w-11 place-items-center rounded-full bg-rust text-cream"><dc-import name="Icon" i="x" cls="h-5 w-5" hint-size="20px,20px"></dc-import></button></div>
    <div class="flex flex-col gap-7 p-4 lg:sticky lg:top-28 lg:p-0">
      <fieldset>
        <legend class="mb-3 font-display text-xl uppercase tracking-wide text-cream">{{ catLegend }}</legend>
        <ul class="flex flex-col gap-1"><sc-for list="{{ catOpts }}" as="o"><li><label class="flex min-h-10 cursor-pointer items-center gap-3 text-sm text-peach transition-colors hover:text-cream"><input type="checkbox" checked="{{ o.on }}" onChange="{{ o.toggle }}" class="h-5 w-5 rounded border-peach/40 bg-transparent text-ember focus:ring-flame focus:ring-offset-0"><span class="flex-1">{{ o.label }}</span><span class="text-xs text-peach/60">{{ o.n }}</span></label></li></sc-for></ul>
      </fieldset>
      <sc-if value="{{ hasSizes }}"><fieldset>
        <legend class="mb-3 font-display text-xl uppercase tracking-wide text-cream">Size</legend>
        <div class="flex flex-wrap gap-2"><sc-for list="{{ sizeOpts }}" as="o"><button type="button" onClick="{{ o.toggle }}" aria-pressed="{{ o.pressed }}" class="min-h-10 min-w-12 rounded-md px-2 text-sm font-bold ring-1 transition duration-200 {{ o.cls }}">{{ o.label }}</button></sc-for></div>
      </fieldset></sc-if>
      <fieldset>
        <legend class="mb-3 font-display text-xl uppercase tracking-wide text-cream">Colour</legend>
        <div class="flex flex-wrap gap-2"><sc-for list="{{ colorOpts }}" as="o"><button type="button" onClick="{{ o.toggle }}" aria-pressed="{{ o.pressed }}" aria-label="{{ o.label }}" title="{{ o.label }}" class="grid h-10 w-10 place-items-center rounded-full ring-2 ring-offset-2 ring-offset-petrol transition duration-200 lg:ring-offset-midnight {{ o.ring }}"><span class="h-7 w-7 rounded-full ring-1 ring-white/20 {{ o.sw }}"></span></button></sc-for></div>
      </fieldset>
      <fieldset>
        <legend class="mb-3 font-display text-xl uppercase tracking-wide text-cream">Price</legend>
        <ul class="flex flex-col gap-1"><sc-for list="{{ priceOpts }}" as="o"><li><label class="flex min-h-10 cursor-pointer items-center gap-3 text-sm text-peach hover:text-cream"><input type="radio" name="price-{{ uid }}" checked="{{ o.on }}" onChange="{{ o.pick }}" class="h-5 w-5 border-peach/40 bg-transparent text-ember focus:ring-flame focus:ring-offset-0">{{ o.label }}</label></li></sc-for></ul>
      </fieldset>
      <fieldset>
        <legend class="mb-3 font-display text-xl uppercase tracking-wide text-cream">Availability</legend>
        <label class="flex min-h-10 cursor-pointer items-center gap-3 text-sm text-peach hover:text-cream"><input type="checkbox" checked="{{ inStock }}" onChange="{{ toggleStock }}" class="h-5 w-5 rounded border-peach/40 bg-transparent text-ember focus:ring-flame focus:ring-offset-0">In stock only</label>
      </fieldset>
      <div class="flex gap-3 lg:hidden"><button type="button" onClick="{{ clearAll }}" class="min-h-12 flex-1 rounded-md text-sm font-bold uppercase tracking-widest text-cream ring-1 ring-peach/40">Clear</button><button type="button" onClick="{{ closeF }}" class="min-h-12 flex-1 rounded-md bg-rust text-sm font-bold uppercase tracking-widest text-cream">Show {{ count }}</button></div>
    </div>
  </aside>

  <div class="min-w-0 flex-1">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <p class="text-sm text-peach/80" aria-live="polite">{{ showing }}</p>
      <div class="flex items-center gap-2">
        <button type="button" onClick="{{ openF }}" aria-expanded="{{ fOpen }}" class="inline-flex min-h-11 items-center gap-2 rounded-md px-4 text-sm font-bold uppercase tracking-widest text-cream ring-1 ring-peach/40 transition hover:bg-cream hover:text-midnight lg:hidden"><dc-import name="Icon" i="sliders" cls="h-4 w-4" hint-size="16px,16px"></dc-import>Filters<sc-if value="{{ nActive }}"><span class="grid h-5 min-w-5 place-items-center rounded-full bg-ember px-1 text-xs text-midnight">{{ nActive }}</span></sc-if></button>
        <label for="sort-{{ uid }}" class="sr-only">Sort products</label>
        <select id="sort-{{ uid }}" value="{{ sort }}" onChange="{{ onSort }}" class="min-h-11 rounded-md border-0 bg-petrol py-2 pl-3 pr-9 text-sm font-semibold text-cream ring-1 ring-peach/30 focus:ring-2 focus:ring-flame">
          <option value="relevance">Sort: Relevance</option><option value="newest">Newest</option><option value="popular">Most popular</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option>
        </select>
      </div>
    </div>
    <sc-if value="{{ nActive }}">
      <ul class="mt-4 flex flex-wrap items-center gap-2" aria-label="Applied filters">
        <sc-for list="{{ chips }}" as="c"><li><button type="button" onClick="{{ c.remove }}" class="inline-flex min-h-9 items-center gap-1.5 rounded-full bg-cream py-1 pl-3 pr-2 text-xs font-bold uppercase tracking-wider text-midnight transition hover:bg-peach" aria-label="Remove filter {{ c.label }}">{{ c.label }}<dc-import name="Icon" i="x" cls="h-3.5 w-3.5" hint-size="14px,14px"></dc-import></button></li></sc-for>
        <li><button type="button" onClick="{{ clearAll }}" class="min-h-9 px-2 text-xs font-bold uppercase tracking-widest text-flame underline-offset-4 hover:underline">Clear all</button></li>
      </ul>
    </sc-if>

    <sc-if value="{{ loading }}"><ul class="mt-6 grid grid-cols-2 gap-3 sm:gap-4 xl:grid-cols-3" aria-hidden="true"><sc-for list="{{ skel }}" as="x"><li class="flex animate-pulse flex-col gap-3 rounded-md bg-petrol p-3"><div class="aspect-portrait rounded bg-teal"></div><div class="h-4 w-2/3 rounded bg-teal"></div><div class="h-10 rounded bg-teal"></div></li></sc-for></ul><p class="sr-only" role="status">Loading products…</p></sc-if>
    <sc-if value="{{ showGrid }}"><ul class="mt-6 grid grid-cols-2 gap-3 sm:gap-4 xl:grid-cols-3"><sc-for list="{{ items }}" as="p"><li><dc-import name="ProductCard" pid="{{ p }}" hint-size="100%,520px"></dc-import></li></sc-for></ul></sc-if>
    <sc-if value="{{ none }}">
      <div class="mt-6 flex flex-col items-center gap-4 rounded-md bg-petrol px-6 py-16 text-center ring-1 ring-white/10">
        <span class="grid h-16 w-16 place-items-center rounded-full bg-navy text-flame"><dc-import name="Icon" i="search" cls="h-7 w-7" hint-size="28px,28px"></dc-import></span>
        <h2 class="font-display text-4xl uppercase text-cream">{{ noneTitle }}</h2>
        <p class="max-w-md text-sm text-peach/80">{{ noneText }}</p>
        <div class="flex flex-wrap justify-center gap-2"><sc-if value="{{ nActive }}"><button type="button" onClick="{{ clearAll }}" class="min-h-11 rounded-md bg-rust px-5 text-sm font-bold uppercase tracking-widest text-cream hover:bg-ember hover:text-midnight">Clear filters</button></sc-if><sc-for list="{{ tryLinks }}" as="t"><a href="{{ t.href }}" class="inline-flex min-h-11 items-center rounded-full px-4 text-sm text-cream ring-1 ring-peach/30 hover:bg-cream hover:text-midnight">{{ t.label }}</a></sc-for></div>
      </div>
    </sc-if>

    <sc-if value="{{ hasPages }}">
      <nav aria-label="Pagination" class="mt-10 flex items-center justify-center gap-2">
        <button type="button" onClick="{{ prev }}" disabled="{{ atFirst }}" aria-label="Previous page" class="grid h-11 w-11 place-items-center rounded-full text-cream ring-1 ring-peach/40 transition hover:bg-cream hover:text-midnight disabled:opacity-30 disabled:hover:bg-transparent disabled:hover:text-cream"><dc-import name="Icon" i="chevron-left" cls="h-5 w-5" hint-size="20px,20px"></dc-import></button>
        <sc-for list="{{ pages }}" as="p"><button type="button" onClick="{{ p.go }}" aria-current="{{ p.cur }}" aria-label="Page {{ p.n }}" class="grid h-11 w-11 place-items-center rounded-full font-display text-lg transition duration-200 {{ p.cls }}">{{ p.n }}</button></sc-for>
        <button type="button" onClick="{{ next }}" disabled="{{ atLast }}" aria-label="Next page" class="grid h-11 w-11 place-items-center rounded-full bg-ember text-midnight transition hover:bg-flame disabled:opacity-30"><dc-import name="Icon" i="chevron-right" cls="h-5 w-5" hint-size="20px,20px"></dc-import></button>
      </nav>
    </sc-if>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PER=9;const blank=()=>({cats:[],subs:[],sizes:[],colors:[],inStock:false,price:'',sort:'relevance'});
class Component extends DCLogic {
  state={f:blank(),page:1,loading:true,drawer:false,localQ:''};fRef=React.createRef();
  componentDidMount(){const go=()=>{if(!window.WN)return setTimeout(go,20);this.u=WN.subscribe(()=>this.forceUpdate());this.reset();};go();}
  componentWillUnmount(){this.u&&this.u();clearTimeout(this.t);this.rel&&this.rel();}
  componentDidUpdate(pp){if(pp.mode!==this.props.mode||pp.arg!==this.props.arg||pp.arg2!==this.props.arg2)this.reset();}
  reset(){const f=blank();if(this.props.arg2)f.subs=[this.props.arg2];this.setState({f,page:1,localQ:this.props.mode==='search'?this.props.arg||'':''});this.load();}
  load(){this.setState({loading:true});clearTimeout(this.t);this.t=setTimeout(()=>this.setState({loading:false}),380);}
  upd(patch,keepPage){this.setState(s=>({f:{...s.f,...patch},page:keepPage?s.page:1}));this.load();}
  tog(k,v){const a=this.state.f[k];this.upd({[k]:a.includes(v)?a.filter(x=>x!==v):[...a,v]});}
  setDrawer(o){this.setState({drawer:o});if(o)setTimeout(()=>{this.rel=WN.trap(this.fRef.current,()=>this.setDrawer(false))},0);else{this.rel&&this.rel();this.rel=null;}}
  renderVals(){
    const W=window.WN;if(!W)return{loading:true,skel:[1,2,3]};
    const {mode,arg}=this.props;const st=this.state,f=st.f;
    const cat=mode==='category'?W.CATS.find(c=>c.slug===arg):null;
    const base=W.base(mode==='category'&&cat?'category':mode,mode==='search'?arg:arg);
    const isCatMode=cat&&cat.subs.length;
    const res=W.query(base,f);const total=res.length,pagesN=Math.max(1,Math.ceil(total/PER)),page=Math.min(st.page,pagesN);
    const items=res.slice((page-1)*PER,page*PER).map(p=>p.id);
    const uniq=a=>[...new Set(a)];const sizeOrder=['XS','S','M','L','XL','4Y','6Y','8Y','10Y','0-6M','6-12M','12-18M','38','39','40','41','42','43','44'];
    const sizes=uniq(base.flatMap(p=>p.sizes)).sort((a,b)=>sizeOrder.indexOf(a)-sizeOrder.indexOf(b));const colors=uniq(base.flatMap(p=>p.colors));
    const catOpts=isCatMode?cat.subs.map(s=>({label:s,n:base.filter(p=>p.sub===s).length,on:f.subs.includes(s),toggle:()=>this.tog('subs',s)})).filter(o=>o.n)
      :W.CATS.slice(0,5).map(c=>({label:c.label,n:base.filter(p=>p.cat===c.slug).length,on:f.cats.includes(c.slug),toggle:()=>this.tog('cats',c.slug)})).filter(o=>o.n);
    const chips=[...f.cats.map(c=>({label:W.CATS.find(x=>x.slug===c).label,remove:()=>this.tog('cats',c)})),...f.subs.map(s=>({label:s,remove:()=>this.tog('subs',s)})),...f.sizes.map(s=>({label:'Size '+s,remove:()=>this.tog('sizes',s)})),...f.colors.map(s=>({label:s,remove:()=>this.tog('colors',s)})),
      ...(f.price?[{label:W.PRICE.find(p=>p.id===f.price).label,remove:()=>this.upd({price:''})}]:[]),...(f.inStock?[{label:'In stock',remove:()=>this.upd({inStock:false})}]:[])];
    const hero=cat||(mode==='search'?{kicker:'Search results',title:arg?`“${arg}”`:'Search',img:62,img2:92,blurb:`${base.length} ${base.length===1?'product matches':'products match'} your search.`}:{kicker:'The full collection',title:'Shop all',img:96,img2:35,blurb:'Every WooNext piece in one place — filter by size, colour and price to find your perfect look.'});
    const pages=[];for(let i=1;i<=pagesN;i++)pages.push({n:i,cur:i===page?'page':undefined,cls:i===page?'bg-cream text-midnight':'text-cream ring-1 ring-peach/30 hover:bg-white/10',go:()=>{this.setState({page:i});this.load();window.scrollTo({top:0,behavior:'smooth'})}});
    const crumbs=[{label:'Home',href:'#/'},...(mode==='category'?[{label:'Shop',href:'#/shop'},...(this.props.arg2?[{label:hero.label||'',href:'#/category/'+arg}]:[])]:mode==='search'?[{label:'Shop',href:'#/shop'}]:[])];
    const lastLabel=this.props.arg2||(cat?cat.label:mode==='search'?'Search':'Shop');
    return{uid:mode+arg,heroA:W.img(hero.img,900),heroB:W.img(hero.img2,900),kicker:hero.kicker,title:hero.title,blurb:hero.blurb,
      crumbs:[...crumbs.map(c=>({...c,last:false})),{label:lastLabel,href:'',last:true}],
      isSearch:mode==='search',localQ:st.localQ,onLocalQ:e=>this.setState({localQ:e.target.value}),submitQ:e=>{e.preventDefault();const q=st.localQ.trim();if(q)W.go('/search/'+encodeURIComponent(q));},
      hasSubs:!!isCatMode,subNav:isCatMode?[{label:'All',href:'#/category/'+arg,n:base.length,cur:!this.props.arg2?'page':undefined,cls:!this.props.arg2?'bg-ember text-midnight':'text-cream ring-1 ring-peach/30 hover:bg-cream hover:text-midnight'},...cat.subs.map(s=>{const on=this.props.arg2===s;return{label:s,n:base.filter(p=>p.sub===s).length,href:'#/category/'+arg+'/'+encodeURIComponent(s),cur:on?'page':undefined,cls:on?'bg-ember text-midnight':'text-cream ring-1 ring-peach/30 hover:bg-cream hover:text-midnight'}})]:[],
      catLegend:isCatMode?'Type':'Category',catOpts,hasSizes:sizes.length>0,
      sizeOpts:sizes.map(s=>{const on=f.sizes.includes(s);return{label:s,pressed:on?'true':'false',cls:on?'bg-ember text-midnight ring-ember':'text-cream ring-peach/30 hover:ring-cream',toggle:()=>this.tog('sizes',s)}}),
      colorOpts:colors.map(c=>{const on=f.colors.includes(c);return{label:c,sw:W.SWATCH[c]||'bg-neutral-500',pressed:on?'true':'false',ring:on?'ring-ember':'ring-transparent hover:ring-peach/40',toggle:()=>this.tog('colors',c)}}),
      priceOpts:[{id:'',label:'Any price'},...W.PRICE].map(p=>({label:p.label,on:f.price===p.id,pick:()=>this.upd({price:p.id})})),
      inStock:f.inStock,toggleStock:()=>this.upd({inStock:!f.inStock}),sort:f.sort,onSort:e=>this.upd({sort:e.target.value}),
      chips,nActive:chips.length,clearAll:()=>{const b=blank();b.sort=f.sort;this.setState({f:b,page:1});this.load();},
      count:total,showing:total?`Showing ${(page-1)*PER+1}–${Math.min(page*PER,total)} of ${total} products`:'0 products',
      loading:st.loading,skel:[1,2,3,4,5,6],showGrid:!st.loading&&total>0,items,none:!st.loading&&total===0,
      noneTitle:mode==='search'&&!base.length?'Nothing found':'No matches',
      noneText:mode==='search'&&!base.length?`We couldn’t find anything for “${arg}”. Try a broader term, check the spelling, or browse a popular category.`:'No products match these filters. Try removing a filter or two.',
      tryLinks:[['Jackets','/search/jacket'],['Dresses','/search/dress'],['New arrivals','/category/new'],['Offers','/category/offers']].map(([label,h])=>({label,href:'#'+h})),
      hasPages:!st.loading&&pagesN>1,pages,atFirst:page<=1,atLast:page>=pagesN,
      prev:()=>{this.setState({page:page-1});this.load();window.scrollTo({top:0,behavior:'smooth'})},next:()=>{this.setState({page:page+1});this.load();window.scrollTo({top:0,behavior:'smooth'})},
      fRef:this.fRef,drawer:st.drawer?'visible translate-x-0':'invisible -translate-x-full',backdrop:st.drawer?'opacity-100':'pointer-events-none opacity-0',fOpen:st.drawer?'true':'false',fRole:st.drawer?'dialog':undefined,fModal:st.drawer?'true':undefined,
      openF:()=>this.setDrawer(true),closeF:()=>this.setDrawer(false)};
  }
}
</script>
</body>
</html>
